<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>魔法藥草筆記 · Grimoire Herbarium</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="index">
<div class="page-wrap">

  <header class="site-header">
    <div class="alchemy-ring" aria-hidden="true">🜍</div>
    <h1 class="site-title">魔法藥草筆記</h1>
    <p class="site-subtitle">Grimoire Herbarium · 以掌管行星、元素與魔法屬性編纂之秘典</p>
  </header>

  <div class="toolbar">
    <a class="btn" href="edit.html">✎ 編纂新條目</a>
    <button type="button" class="btn ghost" id="btn-export">⤓ 導出備份</button>
    <label class="btn ghost file-btn">⤒ 導入備份<input type="file" id="import-file" accept="application/json,.json" hidden></label>
  </div>

  <section class="paper filter-panel">
    <div class="filter-row">
      <label class="filter-label">掌管行星</label>
      <div class="chips" id="chips-planet"></div>
    </div>
    <div class="filter-row">
      <label class="filter-label">代表元素</label>
      <div class="chips" id="chips-element"></div>
    </div>
    <div class="filter-row">
      <label class="filter-label">魔法屬性</label>
      <div class="chips" id="chips-magicProperties"></div>
    </div>
    <div class="filter-row">
      <label class="filter-label">檢索</label>
      <input type="search" id="search" class="search-input" placeholder="以名稱、學名、神靈或屬性搜尋…">
    </div>
    <div class="filter-meta"><span id="result-count"></span><button id="clear-filters" class="link-btn">✦ 清除所有篩選</button></div>
  </section>

  <main class="herb-grid" id="herb-grid"></main>

  <footer class="site-footer">✦ 自行編纂之條目儲存於本機瀏覽器，請定期「導出備份」✦</footer>
</div>

<script src="herbs.js"></script>
<script src="app.js"></script>
</body>
</html>
